name: Forms Library Review

on:
  pull_request:
    branches: [assistant/forms-additions-109, codex/forms-additions-preview-20260920]
  push:
    branches: [codex/forms-library-complete, codex/forms-redesign-preview-20260920]

permissions:
  contents: read

concurrency:
  group: forms-library-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install jsonschema==4.26.0
      - run: npm run test:forms
      - run: npm run test:simple-calculator
      - run: npm run lint
      - run: npm run build
      - run: npm run test:forms-routes
      - run: npm run typecheck
      - run: npm run test:chat
