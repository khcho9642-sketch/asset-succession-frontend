name: Forms Library Review

on:
  pull_request:
    branches: [assistant/forms-additions-109, codex/forms-additions-preview-20260920, codex/forms-redesign-preview-20260920, codex/forms-life-guides-20260921]
  push:
    branches: [codex/forms-library-complete, codex/forms-redesign-preview-20260920, codex/forms-life-guides-20260921, codex/forms-preview-completion-20260922]

permissions:
  contents: read

concurrency:
  group: forms-library-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install jsonschema==4.26.0 Pillow==11.3.0 olefile==0.47 pypdf==6.1.1
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Verify real preview assets
        if: github.head_ref == 'codex/forms-preview-completion-20260922' || github.ref_name == 'codex/forms-preview-completion-20260922'
        run: |
          python scripts/forms-preview-generator-tests.py
          python scripts/forms-build-preview-index.py --check
          python scripts/forms-preview-assets-tests.py
      - run: npm run test:forms
      - run: npm run test:simple-calculator
      - run: npm run lint
      - run: npm run build
      - run: npm run test:forms-routes
      - run: npm run typecheck
      - run: npm run test:chat
