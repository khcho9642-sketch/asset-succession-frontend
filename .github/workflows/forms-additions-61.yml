name: Forms additions 61
on:
  workflow_dispatch:
  push:
    branches: [assistant/forms-additions-61]
    paths: ['.github/workflows/forms-additions-61.yml', 'scripts/forms-additions*', 'docs/forms-additions-61/**', 'app/forms/**', 'public/downloads/official-forms/**', 'tasks.md']
permissions:
  contents: read
concurrency:
  group: forms-additions-61-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect and collect official sources
        run: |
          python -m pip install requests beautifulsoup4 olefile pypdf playwright
          python -m playwright install --with-deps chromium
          if ! test -f docs/forms-additions-61/discovery/index.json; then python scripts/forms-additions-discover.py; fi
          if ! test -f docs/forms-additions-61/browser/index.json; then python scripts/forms-additions-browser.py; fi
          if test -f scripts/forms-additions-collect.py; then python scripts/forms-additions-collect.py; fi
      - name: Validate registered additions
        if: hashFiles('scripts/forms-additions-tests.mjs') != ''
        run: node --test scripts/forms-additions-tests.mjs
      - name: Commit only collection scope, never deploy
        run: |
          git fetch origin assistant/forms-additions-61
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tasks.md docs/forms-additions-61 app/forms public/downloads/official-forms
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --name-only
          git commit -m 'data: register verified originals and per-item status without changing legacy records'
          git push origin HEAD:assistant/forms-additions-61
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forms-additions-61-proof
          path: |
            .tmp/forms-additions-proof/
            docs/forms-additions-61/
            tasks.md
          retention-days: 7
