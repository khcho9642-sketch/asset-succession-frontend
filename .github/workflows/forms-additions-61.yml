name: Forms additions 61
on:
  workflow_dispatch:
  push:
    branches: [assistant/forms-additions-61]
    paths: ['.github/workflows/forms-additions-61.yml', 'scripts/forms-additions*', 'docs/forms-additions-61/**', 'app/forms/**', 'public/downloads/official-forms/**', 'tasks.md']
permissions:
  contents: read
concurrency:
  group: forms-additions-61-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve exact baseline source and task list
        run: |
          mkdir -p .tmp/forms-additions-proof
          git archive --format=tar HEAD | gzip > .tmp/forms-additions-proof/source.tar.gz
          git rev-parse HEAD > .tmp/forms-additions-proof/commit.txt
          cp tasks.md .tmp/forms-additions-proof/tasks.md
      - name: Verify public source pages and originals
        if: hashFiles('scripts/forms-additions-research.py') != ''
        run: |
          python -m pip install requests beautifulsoup4 olefile
          python scripts/forms-additions-research.py
      - name: Validate additions
        if: hashFiles('scripts/forms-additions-tests.mjs') != ''
        run: node --test scripts/forms-additions-tests.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forms-additions-61-proof
          path: .tmp/forms-additions-proof/
          retention-days: 7
