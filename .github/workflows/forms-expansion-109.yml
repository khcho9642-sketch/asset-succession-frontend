name: Forms expansion 109
on:
  push:
    branches: [assistant/forms-additions-109]
    paths: ['scripts/forms-expansion*', 'scripts/forms-browser-*', 'docs/forms-expansion-109/inputs/**', 'docs/forms-expansion-109/resume-sources.json', '.github/workflows/forms-expansion-109.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: forms-expansion-109
  cancel-in-progress: false
jobs:
  collect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover already acquired originals and evidence
        uses: actions/download-artifact@v4
        with:
          name: forms-expansion-109-proof
          run-id: 35206693723
          github-token: ${{ github.token }}
          path: .tmp/recovered
      - name: Restore verified records and fix failed JSX integration
        run: python scripts/forms-expansion-rescue.py
      - name: Lint types and production build
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund
          npm run lint 2>&1 | tee .tmp/forms-expansion-proof/lint.log
          npm run typecheck 2>&1 | tee .tmp/forms-expansion-proof/typecheck.log
          npm run build 2>&1 | tee .tmp/forms-expansion-proof/build.log
      - name: Commit verified files and metadata on working branch only
        run: |
          git fetch origin assistant/forms-additions-109
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tasks.md docs/forms-expansion-109 app/forms public/downloads/official-forms/manifest.json public/downloads/official-forms/additions
          if test -d public/downloads/official-forms/expansion; then git add public/downloads/official-forms/expansion; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(forms): recover inspected originals and repair catalog JSX'
          git push origin HEAD:assistant/forms-additions-109
      - name: Preserve resumable evidence and source
        if: always()
        run: |
          mkdir -p .tmp/forms-expansion-proof/source
          cp -r app/forms .tmp/forms-expansion-proof/source/
          cp public/downloads/official-forms/manifest.json .tmp/forms-expansion-proof/manifest.json
          git rev-parse HEAD > .tmp/forms-expansion-proof/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forms-expansion-109-rescue-proof
          path: |
            .tmp/forms-expansion-proof/
            docs/forms-expansion-109/
            tasks.md
            public/downloads/official-forms/additions/
            public/downloads/official-forms/expansion/
          include-hidden-files: true
          retention-days: 7
