name: PR Quality Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - codex/issue-1-premium-redesign
      - codex/issue-3-post-merge-hardening
      - codex/issue-7-phase-2b-engine-foundation

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Phase 2B unit tests
        run: npm run test:phase2b

      - name: Production build
        run: npm run build

  ui-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Install Playwright Chromium
        run: |
          python -m pip install pypdf
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static preview server
        run: |
          mkdir -p artifacts/ui-audit
          npx serve@14.2.6 out -l 4173 > /tmp/ui-server.log 2>&1 &
          echo $! > /tmp/ui-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ui-server.log
          exit 1

      - name: Run responsive UI audit and capture screenshots
        env:
          BASE_URL: http://127.0.0.1:4173
          UI_AUDIT_DIR: artifacts/ui-audit
        run: node scripts/ui-audit.mjs

      - name: Run real A4 PDF audit
        env:
          BASE_URL: http://127.0.0.1:4173
          PDF_AUDIT_DIR: artifacts/ui-audit
        run: node scripts/pdf-audit.mjs

      - name: Collect static server log
        if: always()
        run: cp /tmp/ui-server.log artifacts/ui-audit/static-server.log || true

      - name: Upload UI audit screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit-${{ github.sha }}
          path: artifacts/ui-audit
          if-no-files-found: warn
          retention-days: 14
