name: PR Quality Checks

on:
  pull_request:
    branches:
      - main
      - codex/home-hero-paper-carousel
  push:
    branches:
      - codex/issue-1-premium-redesign
      - codex/issue-3-post-merge-hardening
      - codex/issue-7-phase-2b-engine-foundation
      - codex/home-hero-paper-carousel
      - codex/inheritance-chat-report

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Phase 2B unit tests
        run: npm run test:phase2b

      - name: Chat intake domain tests
        run: npm run test:chat

      - name: Tax calculation and comparison tests
        run: npm run test:tax

      - name: Production build
        run: npm run build

  ui-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Build production application
        run: npm run build

      - name: Install Playwright Chromium
        run: |
          python -m pip install pypdf
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start production preview server
        id: preview
        run: |
          mkdir -p artifacts/ui-audit
          npm start -- --hostname 127.0.0.1 --port 4173 > /tmp/ui-server.log 2>&1 &
          echo $! > /tmp/ui-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ui-server.log
          exit 1

      - name: Audit prerendered seven-page sample tax report
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node scripts/sample-report-static-audit.mjs

      - name: Audit fitted sample page navigation and seven-page A4 PDF
        env:
          BASE_URL: http://127.0.0.1:4173
          UI_AUDIT_DIR: artifacts/ui-audit
        run: node scripts/sample-report-ui-audit.mjs

      - name: Upload sample viewer review
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: sample-viewer-${{ github.sha }}
          path: artifacts/ui-audit/sample-report-*
          retention-days: 14
          if-no-files-found: warn

      - name: Audit chat API validation without a provider key
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npm run test:chat-api

      - name: Audit guided chat and mocked AI report flows
        env:
          BASE_URL: http://127.0.0.1:4173
          UI_AUDIT_DIR: artifacts/ui-audit
        run: npm run test:chat-ui

      - name: Audit tax comparison and seven-page reports
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        env:
          BASE_URL: http://127.0.0.1:4173
          UI_AUDIT_DIR: artifacts/ui-audit
        run: npm run test:tax-ui

      - name: Audit housing and business inheritance reports
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        env:
          BASE_URL: http://127.0.0.1:4173
          UI_AUDIT_DIR: artifacts/ui-audit
        run: npm run test:tax-extensions-ui

      - name: Upgrade saved assessment to an estimated tax report
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        env:
          BASE_URL: http://127.0.0.1:4173
          UI_AUDIT_DIR: artifacts/ui-audit
        run: node scripts/estimate-report-ui-audit.mjs

      - name: Run responsive UI audit and capture screenshots
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        env:
          BASE_URL: http://127.0.0.1:4173
          UI_AUDIT_DIR: artifacts/ui-audit
        run: node scripts/ui-audit.mjs

      - name: Run end-to-end smoke audit
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        env:
          PR2_BASE_URL: http://127.0.0.1:4173
        run: npm run test:smoke

      - name: Run real A4 PDF audit
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        env:
          BASE_URL: http://127.0.0.1:4173
          PDF_AUDIT_DIR: artifacts/ui-audit
        run: node scripts/pdf-audit.mjs

      - name: Verify approved paper report format with the 52-eok conversation
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        env:
          BASE_URL: http://127.0.0.1:4173
          UI_AUDIT_DIR: artifacts/ui-audit
        run: node scripts/paper-report-audit.mjs

      - name: Collect application server log
        if: always()
        run: cp /tmp/ui-server.log artifacts/ui-audit/application-server.log || true

      - name: Upload UI audit screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit-${{ github.sha }}
          path: artifacts/ui-audit
          if-no-files-found: warn
          retention-days: 14
