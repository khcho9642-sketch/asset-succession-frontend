name: Forms library integration

on:
  push:
    branches: [assistant/forms-library-ui]
    paths:
      - app/forms/**
      - next.config.mjs
      - scripts/generate-forms-library-previews.py
      - scripts/forms-library-ui-audit.py
      - .github/workflows/forms-library-ui.yml

permissions:
  contents: read

concurrency:
  group: forms-library-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-library:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify change boundary
        run: |
          python - <<'PY'
          import subprocess
          base='4a9718be427552f5244a3fdea6ece8edc12617c4'
          subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)
          changed=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          allowed=('app/forms/','public/downloads/asset-succession-forms-v1/previews/','docs/reviews/FORMS_LIBRARY_UI')
          exact={'next.config.mjs','scripts/generate-forms-library-previews.py','scripts/forms-library-ui-audit.py','.github/workflows/forms-library-ui.yml'}
          unexpected=[path for path in changed if path not in exact and not path.startswith(allowed)]
          assert not unexpected,unexpected
          print('Original documents, PublicNav, home, latest chat/MCP, tax and sample assets unchanged.')
          PY
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          python -m pip install --disable-pip-version-check PyMuPDF==1.26.4 Pillow==11.3.0 playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Generate first-page example thumbnails and verify document hashes
        run: python scripts/generate-forms-library-previews.py
      - name: Lint, types, existing domain tests and production build
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee .tmp/forms-library-proof/lint.log
          npm run typecheck 2>&1 | tee .tmp/forms-library-proof/typecheck.log
          npm run test:phase2b 2>&1 | tee .tmp/forms-library-proof/phase2b.log
          npm run test:chat 2>&1 | tee .tmp/forms-library-proof/chat.log
          npm run test:tax 2>&1 | tee .tmp/forms-library-proof/tax.log
          npm run build 2>&1 | tee .tmp/forms-library-proof/build.log
      - name: Start this source's production server
        run: |
          npm run start -- --hostname 127.0.0.1 --port 4188 > .tmp/forms-library-proof/server.log 2>&1 &
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:4188/forms > /dev/null && break; sleep 2; done
          curl -fsS http://127.0.0.1:4188/forms > /dev/null
      - name: Verify route, responsive views, modal, original downloads and shared header
        run: |
          set -o pipefail
          python scripts/forms-library-ui-audit.py 2>&1 | tee .tmp/forms-library-proof/ui.log
      - name: Commit only the verified thumbnails
        run: |
          git fetch origin assistant/forms-library-ui
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/downloads/asset-succession-forms-v1/previews/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'assets: add verified first-page previews of existing examples'
          git push origin HEAD:assistant/forms-library-ui
      - name: Save screenshots, verification and exact source for review
        if: always()
        run: |
          mkdir -p .tmp/forms-library-proof/source
          cp -r app/forms .tmp/forms-library-proof/source/
          cp next.config.mjs .tmp/forms-library-proof/source/
          cp scripts/forms-library-ui-audit.py .tmp/forms-library-proof/source/
          git rev-parse HEAD > .tmp/forms-library-proof/final-sha.txt
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forms-library-integration-proof
          path: .tmp/forms-library-proof/
          include-hidden-files: true
          retention-days: 7
