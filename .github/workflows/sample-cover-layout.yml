name: Verify deployed sample cover

on:
  push:
    branches: [codex/chat-opening-topics]
    paths: [.github/workflows/sample-cover-layout.yml]

permissions:
  contents: read

jobs:
  verify-cover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare browser
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Verify live image, PDF and page navigation
        run: |
          python - <<'PY'
          import hashlib, json, os, time, urllib.request
          from pathlib import Path
          from playwright.sync_api import sync_playwright, expect

          root = Path.cwd()
          output = root / '.tmp/sample-cover-live-proof'
          output.mkdir(parents=True, exist_ok=True)
          base = 'https://frontend-prototype-git-codex-chat-0328a9-khcho98-6477s-projects.vercel.app'
          manifest = json.loads((root / 'public/media/sample-report-v3/manifest.json').read_text())
          assert manifest['version'] == 5

          def read(path):
              request = urllib.request.Request(base + path, headers={'Cache-Control': 'no-cache'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  assert response.status == 200
                  return response.read()

          deadline = time.monotonic() + 180
          while True:
              try:
                  deployed = json.loads(read('/media/sample-report-v3/manifest.json?cover_check=' + os.environ['GITHUB_SHA']))
                  if deployed['pages'][0]['sha256'] == manifest['pages'][0]['sha256']:
                      break
              except Exception as error:
                  print('Deployment not yet readable:', type(error).__name__, str(error)[:180], flush=True)
              if time.monotonic() >= deadline:
                  raise RuntimeError('Could not verify the updated preview deployment within 180 seconds')
              time.sleep(10)

          for index in [0, 1]:
              item = manifest['pages'][index]
              assert hashlib.sha256(read(item['image'])).hexdigest() == item['sha256']
          pdf_path = manifest['pdf']
          assert hashlib.sha256(read(pdf_path)).digest() == hashlib.sha256((root / 'public' / pdf_path.lstrip('/')).read_bytes()).digest()

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={'width': 1440, 'height': 1000}, device_scale_factor=1)
              page.goto(base + '/sample-report', wait_until='networkidle')
              page.locator('[data-sample-document][data-fitted="true"]').wait_for()
              expect(page.locator('[data-sample-viewer]')).to_have_attribute('data-current-page', '1')
              cover = page.locator('[data-report-page="1"] img')
              assert cover.get_attribute('src') == manifest['pages'][0]['image']
              assert cover.evaluate('(image) => image.complete && image.naturalWidth === 1400 && image.naturalHeight === 1980')
              expect(page.get_by_role('link', name='PDF 저장')).to_have_attribute('href', pdf_path)
              first_box = cover.bounding_box()
              page.screenshot(path=str(output / 'sample-cover-desktop.png'))
              page.get_by_role('button', name='다음 페이지', exact=True).click()
              expect(page.locator('[data-sample-viewer]')).to_have_attribute('data-current-page', '2')
              second = page.locator('[data-report-page="2"] img')
              assert second.get_attribute('src') == manifest['pages'][1]['image']
              second_box = second.bounding_box()
              assert abs(first_box['width'] - second_box['width']) < 1
              assert abs(first_box['height'] - second_box['height']) < 1
              page.screenshot(path=str(output / 'sample-page-two-desktop.png'))
              page.get_by_role('button', name='이전 페이지', exact=True).click()
              page.set_viewport_size({'width': 375, 'height': 812})
              page.wait_for_timeout(700)
              assert page.locator('[data-report-page="1"] img').is_visible()
              page.screenshot(path=str(output / 'sample-cover-mobile.png'))
              browser.close()

          result = {'preview_url': base + '/sample-report', 'cover_sha256_verified': True, 'page_two_sha256_unchanged': True, 'download_pdf_matches': True, 'desktop_navigation_verified': True, 'page_dimensions_equal': True, 'mobile_verified': True}
          (output / 'verification.json').write_text(json.dumps(result, ensure_ascii=False, indent=2))
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY
      - name: Save live verification proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-cover-live-proof
          path: .tmp/sample-cover-live-proof/
          include-hidden-files: true
          retention-days: 7
