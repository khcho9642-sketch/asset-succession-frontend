name: Public header consistency

on:
  push:
    branches: [codex/chat-opening-topics]
    paths:
      - components/PublicNav.tsx
      - components/PublicNav.module.css
      - components/PublicLightNav.tsx
      - app/sample-report/page.tsx
      - app/report-preview/page.tsx
      - scripts/public-header-ui-audit.py
      - .github/workflows/public-header-check.yml

permissions:
  contents: read

concurrency:
  group: public-header-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-public-header:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check changed application files
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx eslint components/PublicNav.tsx components/PublicLightNav.tsx app/sample-report/page.tsx app/report-preview/page.tsx
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare browser
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Check seven routes and five viewport widths
        env:
          PUBLIC_HEADER_BASE_URL: https://frontend-prototype-git-codex-chat-0328a9-khcho98-6477s-projects.vercel.app
        run: python scripts/public-header-ui-audit.py
      - name: Save screenshots and verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-header-consistency-proof
          path: .tmp/public-header-proof/
          include-hidden-files: true
          retention-days: 14
