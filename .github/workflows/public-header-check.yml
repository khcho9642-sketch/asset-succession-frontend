name: Public header consistency

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Production URL, or an explicitly selected preview URL'
        required: true
        default: 'https://asset360.intellic.co.kr'
        type: string

permissions:
  contents: read

concurrency:
  group: public-header-${{ inputs.base_url || 'https://asset360.intellic.co.kr' }}
  cancel-in-progress: true

jobs:
  verify-public-header:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       (github.event.deployment.production_environment == true || github.event.deployment.environment == 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check changed application files
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx eslint components/PublicNav.tsx components/PublicLightNav.tsx app/sample-report/page.tsx app/report-preview/page.tsx
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare browser
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Check seven routes and five viewport widths
        env:
          PUBLIC_HEADER_BASE_URL: ${{ inputs.base_url || 'https://asset360.intellic.co.kr' }}
        run: python scripts/public-header-ui-audit.py
      - name: Save screenshots and verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-header-consistency-proof
          path: .tmp/public-header-proof/
          include-hidden-files: true
          retention-days: 14
