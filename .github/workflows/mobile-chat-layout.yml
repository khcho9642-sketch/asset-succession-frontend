name: Mobile diagnosis layout

on:
  push:
    branches: [codex/chat-opening-topics]
    paths:
      - components/DiagnosisChat.tsx
      - components/DiagnosisChat.module.css
      - components/useDiagnosisViewport.ts
      - scripts/mobile-diagnosis-ui-audit.py
      - .github/workflows/mobile-chat-layout.yml

permissions:
  contents: read

concurrency:
  group: mobile-chat-layout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-mobile-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONUNBUFFERED: '1'
      MOBILE_CHAT_BASE_URL: https://frontend-prototype-git-codex-chat-0328a9-khcho98-6477s-projects.vercel.app
      MOBILE_CHAT_PROOF_DIR: .tmp/mobile-chat-live-proof
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare browser
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Wait for the hydrated mobile layout deployment
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright,TimeoutError as PlaywrightTimeout
          with sync_playwright() as p:
              browser=p.chromium.launch()
              page=browser.new_page(viewport={'width':360,'height':672})
              for attempt in range(18):
                  page.goto(os.environ['MOBILE_CHAT_BASE_URL']+'/precheck',wait_until='domcontentloaded')
                  try:
                      page.locator('[data-chat-layout="mobile-fit-v1"]').wait_for(state='visible',timeout=5000)
                      break
                  except PlaywrightTimeout:
                      print('Waiting for updated client UI',attempt+1)
                      page.wait_for_timeout(5000)
              else: raise RuntimeError('Updated preview not yet readable')
              browser.close()
          PY
      - name: Verify deployed layout with synthetic conversations and keyboard viewport changes
        run: python scripts/mobile-diagnosis-ui-audit.py
      - name: Check unclipped buttons and capture ordinary visitor sessions
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from playwright.sync_api import sync_playwright,expect
          out=Path(os.environ['MOBILE_CHAT_PROOF_DIR'])
          checks=[]
          with sync_playwright() as p:
              browser=p.chromium.launch()
              for width,height in [(320,568),(360,672),(375,667)]:
                  context=browser.new_context(viewport={'width':width,'height':height},is_mobile=True,has_touch=True,device_scale_factor=1)
                  page=context.new_page()
                  response=page.goto(os.environ['MOBILE_CHAT_BASE_URL']+'/precheck',wait_until='networkidle')
                  assert response and response.status==200
                  expect(page.locator('[data-chat-layout="mobile-fit-v1"]')).to_be_visible()
                  page.wait_for_timeout(200)
                  log=page.get_by_role('log',name='대화 내용').bounding_box()
                  for name in ['상속','증여','양도','가업상속']:
                      button=page.get_by_role('button',name=name,exact=True)
                      box=button.bounding_box()
                      assert box['y'] >= log['y'] and box['y']+box['height'] <= log['y']+log['height']+1, (name,box,log)
                      assert button.evaluate('(e)=>{const r=e.getBoundingClientRect();return e.contains(document.elementFromPoint(r.x+r.width/2,r.y+r.height/2));}'), name+' obscured'
                  for element in [page.locator('#diagnosis-message'),page.get_by_role('button',name='메시지 보내기',exact=True)]:
                      box=element.bounding_box()
                      assert box['y']+box['height']<=height
                      assert element.evaluate('(e)=>{const r=e.getBoundingClientRect();return e.contains(document.elementFromPoint(r.x+r.width/2,r.y+r.height/2));}'), 'Composer obscured'
                  assert page.locator('vercel-live-feedback,vercel-toolbar,[data-vercel-toolbar]').count()==0
                  page.screenshot(path=str(out/f'deployed-opening-{width}.png'))
                  checks.append({'width':width,'height':height,'buttons_inside_scroll_area':True,'composer_unobscured':True,'toolbar_absent':True,'api_mocked':False})
                  context.close()
              browser.close()
          (out/'live-layout-verification.json').write_text(json.dumps(checks,ensure_ascii=False,indent=2))
          PY
      - name: Save deployed screenshots and verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-chat-live-proof
          path: .tmp/mobile-chat-live-proof/
          include-hidden-files: true
          retention-days: 7
